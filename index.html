<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seu Próximo Endereço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;700&family=Arimo:wght@400;700&display=swap">
<style>
/* Layout: jogo em formato de story, uma tela por vez numa coluna de celular; capítulos navy abrem e fecham, cenas em fundo claro. Padrão dos e-mails Weve: Georgia Bold + Arial, cantos retos. */
:root{
  --navy:#0C1F42;      /* fundo dos capítulos escuros */
  --navy-2:#16284F;    /* variação de card sobre navy */
  --ink:#16223F;       /* títulos sobre claro */
  --gold:#C9A84C;      /* CTA e destaque */
  --gold-dk:#B5905A;   /* selos e capítulos sobre claro */
  --champ:#D6B585;     /* selos e traços sobre navy */
  --light:#F7F5F1;     /* fundo das cenas */
  --paper:#FFFFFF;
  --text:#555550;      /* corpo sobre claro */
  --mist:#5C6478;      /* subtítulos */
  --line:#DCD6CA;      /* filetes sobre claro */
  --on-navy:#E9E4DA;   /* corpo sobre navy */
  --serif:Georgia,"Gelasio","Times New Roman",serif;
  --sans:Arial,"Arimo","Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{position:relative;width:100%;max-width:440px;height:100%;max-height:920px;overflow:hidden;background:var(--light)}
@media (min-width:600px){#app{box-shadow:0 0 0 1px rgba(214,181,133,.25)}}
.desk-note{display:none}
@media (min-width:900px){
  .desk-note{display:block;position:fixed;left:40px;bottom:36px;max-width:240px;color:var(--champ);font-size:10.5px;letter-spacing:.27em;text-transform:uppercase;line-height:1.9}
  .desk-note b{display:block;font-family:var(--serif);font-size:22px;letter-spacing:0;text-transform:none;color:#fff;margin-bottom:8px;line-height:1.2}
}

/* telas */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateX(28px);transition:opacity .32s ease,transform .45s cubic-bezier(.2,.7,.2,1);background:var(--light);overflow:hidden}
.screen.from-left{transform:translateX(-28px)}
.screen.on{opacity:1;transform:none}
.screen.out-l{opacity:0;transform:translateX(-28px)}
.screen.out-r{opacity:0;transform:translateX(28px)}
.screen.dark,.dark{background-color:var(--navy);color:var(--on-navy)}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* fotos reais: entram por cima da ilustração quando o arquivo existe */
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.kb{animation:kb 7s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.16) translate(-2.5%,-2%)}}

/* tipografia */
.label{font-family:var(--sans);font-size:10.5px;letter-spacing:.27em;text-transform:uppercase;line-height:1.5;color:var(--gold-dk)}
.dark .label{color:var(--champ)}
.h-xl{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.08;letter-spacing:.005em;color:#fff;margin:0;text-wrap:balance}
.h-xl em{font-style:normal;color:var(--champ)}
.h-q{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;color:var(--ink);margin:0;text-wrap:balance}
.h-q .chap{display:block;color:var(--gold-dk)}
.dark .h-q{color:#fff}
.dark .h-q .chap{color:var(--champ)}
.sub{font-size:15px;line-height:1.55;color:var(--mist);margin:8px 0 0}
.dark .sub{color:var(--on-navy)}

/* CTA padrão e-mail: dourado, texto navy, caixa alta, 52px, cantos retos */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;background:var(--gold);color:#0D1F42;font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:0;transition:transform .15s ease,opacity .2s}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.35;cursor:default}
.cta-ghost{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border:1px solid currentColor;font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink);text-align:center}

/* ===== ABERTURA ===== */
.intro{justify-content:space-between}
.intro .topline{display:flex;justify-content:space-between;align-items:center;padding-block:20px 0}
.mark{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.32em;color:#fff}
.intro .h-xl{margin-top:10px;font-size:40px}
.intro .sub{max-width:36ch;margin-top:12px}
.intro{justify-content:flex-start;overflow-y:auto}
.intro .intro-body{margin-top:auto}
.intro .foot{margin-bottom:auto}
.intro-body{padding-block:24px 0}
.doors{display:flex;gap:10px;margin-top:26px}
.door{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.door .pic{position:relative;width:100%;aspect-ratio:9/16;max-height:34vh;overflow:hidden;background:var(--navy-2);box-shadow:0 14px 24px rgba(0,0,0,.35);animation:lift 5.4s ease-in-out infinite}
.door .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.door .pic svg{position:absolute;inset:0;width:100%;height:100%}
.door:nth-of-type(2) .pic{animation-delay:1.8s}
.door:nth-of-type(3) .pic{animation-delay:3.6s}
@keyframes lift{0%,62%,100%{transform:none}76%{transform:translateY(-7px)}}
.door span{display:block;margin-top:12px;font-family:var(--serif);font-weight:400;font-size:14px;color:var(--champ)}
.intro.light{background:var(--light);color:var(--text)}
.intro.light .h-xl{color:var(--ink)}
.intro.light .h-xl em{color:var(--gold-dk)}
.intro.light .sub{color:var(--mist)}
.intro.light .door span{color:var(--gold-dk)}
.intro.light .doors-cap{color:var(--ink)}
.intro.light .meta-line{color:var(--mist)}
.intro.light .meta-line i{color:var(--gold-dk)}
.intro.light .door .pic{box-shadow:0 14px 24px rgba(22,34,63,.18)}

/* variante cartomante: bola de cristal atrás das cartas */
:root{--orb-1:#FFFFFF;--orb-2:#F1EADB;--orb-3:#E2D5BB;--orb-line:#B5905A;--halo:#D6B585;--core:#FFF4DA}
.dark{--orb-1:rgba(214,181,133,.42);--orb-2:rgba(30,51,97,.75);--orb-3:rgba(22,40,79,.95);--orb-line:#D6B585;--halo:#D6B585;--core:#FFE9BF}
.doors{position:relative}
.ball{display:none}
.intro.oracle .doors,.intro.oracle.cards .doors{margin-top:136px}
.intro.oracle .ball{display:block;position:absolute;left:0;right:0;margin:0 auto;top:-138px;width:min(300px,86%);aspect-ratio:1;z-index:0;pointer-events:none}
.intro.oracle .ball svg{width:100%;height:100%;display:block;overflow:visible}
.intro.oracle .door{z-index:1}
.intro.oracle .door:nth-of-type(2){z-index:2}
.ball .swirl{transform-origin:150px 150px;animation:spin 26s linear infinite}
.ball .glow{animation:breathe 4s ease-in-out infinite}
.ball .core{transform-origin:150px 140px;animation:corepulse 3.2s ease-in-out infinite}
.intro.oracle .ball svg{filter:drop-shadow(0 0 18px rgba(214,181,133,.5))}
.ball .tw{animation:tw 3.2s ease-in-out infinite}
.ball .tw.t2{animation-delay:1.1s}.ball .tw.t3{animation-delay:2.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes corepulse{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.06)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.intro.cards .doors{gap:0;justify-content:center;margin-top:34px;margin-bottom:30px;padding-inline:6px}
.intro.cards .door{position:relative;flex:0 0 34%;margin:0 -2.5%}
.intro.cards .door:nth-of-type(1){transform:rotate(-8deg) translateY(14px)}
.intro.cards .door:nth-of-type(2){z-index:2;transform:translateY(-4px)}
.intro.cards .door:nth-of-type(3){transform:rotate(8deg) translateY(14px)}
.intro.cards .door .pic{border:5px solid var(--paper);box-sizing:border-box;box-shadow:0 16px 28px rgba(12,31,66,.28)}
.intro.cards .door span{position:absolute;top:12px;left:12px;z-index:3;margin:0;min-width:26px;height:26px;padding:0 7px;gap:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--champ);font-size:13px}
.stars svg{width:10px;height:10px;display:block;flex:none}
.face.f-front .num.stars{gap:3px;padding:0 7px}
.doors-cap{margin-top:14px;font-family:var(--serif);font-weight:400;font-size:19px;color:#fff;text-align:center}
.intro .foot{padding-block:16px max(20px,env(safe-area-inset-bottom,0px))}
.cta.glow{position:relative;overflow:hidden}
.cta.glow::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,40%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
.intro .meta-line{display:flex;justify-content:center;gap:14px;margin-top:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-navy)}
.intro .meta-line i{font-style:normal;color:var(--champ)}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.18s}.rise.d3{animation-delay:.3s}.rise.d4{animation-delay:.44s}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== CABEÇALHO DAS CENAS ===== */
.top{padding-block:14px 0}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;background:var(--line)}
.segs i.done{background:var(--ink)}
.segs i.now{background:var(--gold)}
.dark .segs i{background:rgba(255,255,255,.18)}
.dark .segs i.done{background:var(--champ)}
.meta{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:28px}
.back{width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin-left:-6px;color:var(--ink)}
.back svg{width:18px;height:18px}
.back[hidden]{display:none}
.meta .label{flex:1}
.count{font-family:var(--serif);font-weight:400;font-size:14px;color:var(--ink)}
.dark .back,.dark .count{color:#fff}
.qblock{padding-block:12px 16px}
.opts{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}

/* seleção */
.pick{position:relative;transition:transform .18s ease,box-shadow .2s ease,opacity .25s}
.pick:active{transform:scale(.985)}
.pick .tick{position:absolute;top:10px;right:10px;width:26px;height:26px;background:var(--gold);color:#0D1F42;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);z-index:3}
.pick .tick svg{width:14px;height:14px}
.pick.sel{box-shadow:inset 0 0 0 3px var(--gold)}
.pick.sel .tick{transform:scale(1)}
.opts.locked .pick:not(.sel){opacity:.45}

/* cena tipo foto */
.shot{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;background:var(--navy);color:var(--champ);overflow:hidden}
.shot:nth-child(2){background:var(--navy-2)}
.shot:nth-child(3){background:#1B3260}
.shot > svg{position:absolute;inset:0;width:100%;height:100%}
.shot .cap{position:relative;z-index:2;padding:22px 14px 12px;background:linear-gradient(to top,rgba(12,31,66,.92),rgba(12,31,66,0));font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.2;color:#fff}
.shot.sel::after,.half.sel::after,.obj.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--gold);z-index:2;pointer-events:none}

/* cena pessoas */
.row{flex:1;min-height:0;display:flex;align-items:center;gap:14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:10px 14px 10px 10px;overflow:hidden}
.row .ico{position:relative;flex:none;width:86px;height:72px;background:var(--navy);color:var(--champ);display:flex;align-items:center;justify-content:center;overflow:hidden}
.row .ico svg{width:64px;height:auto}
.row .txt{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.22;color:var(--ink);padding-right:30px}

/* cena texturas */
.swatches{flex-direction:row;gap:10px}
.swatch{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.swatch .tex{position:relative;flex:1;min-height:0;margin:6px 6px 0;overflow:hidden}
.swatch .tex svg{width:100%;height:100%;display:block}
.swatch .txt{padding:10px 10px 12px;font-family:var(--serif);font-weight:400;font-size:14.5px;line-height:1.25;color:var(--ink);min-height:78px}

/* cena duelo */
.duel{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.half{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px;overflow:hidden;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.12;transition:flex .35s cubic-bezier(.2,.7,.2,1),opacity .25s}
.half .t{position:relative;z-index:2}
.half.a{background:var(--navy);color:#fff}
.half.b{background:var(--navy-2);color:#fff}
.half.a{justify-content:flex-start}
.half > svg{position:absolute;inset:0;width:100%;height:100%;color:var(--champ);opacity:.55}
.half .shade{position:absolute;inset:0;z-index:1;pointer-events:none}
.half.a .shade{background:linear-gradient(to bottom,rgba(12,31,66,.85),rgba(12,31,66,.05) 70%)}
.half.b .shade{background:linear-gradient(to top,rgba(12,31,66,.85),rgba(12,31,66,.05) 70%)}
.half small{display:block;font-family:var(--sans);font-weight:400;font-size:10.5px;letter-spacing:.27em;text-transform:uppercase;margin-bottom:8px;color:var(--champ)}
.half.sel{flex:1.6}
.duel.locked .half:not(.sel){opacity:.5}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;background:var(--gold);color:#0D1F42;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:400;font-size:15px;z-index:4;pointer-events:none;transition:top .35s cubic-bezier(.2,.7,.2,1)}
.duel-swap{animation:swap .42s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.loop path,.loop circle,.loop line{vector-effect:non-scaling-stroke}

/* cena sábado (escolha 3) */
.grid9{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px}
.obj{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:8px 6px;text-align:center;min-height:0;overflow:hidden;transition:background .2s,color .2s,opacity .2s,transform .15s}
.obj svg{width:38px;height:38px;color:var(--ink);flex:none}
.obj span{position:relative;z-index:2;font-size:12px;line-height:1.25;color:var(--ink)}
.obj.has-ph{justify-content:flex-end;padding:0}
.obj.has-ph span{width:100%;box-sizing:border-box;padding:18px 6px 8px;color:#fff;background:linear-gradient(to top,rgba(12,31,66,.9),rgba(12,31,66,0))}
.obj.sel{background:var(--navy)}
.obj.sel svg{color:var(--champ)}
.obj.sel span{color:#fff}
.grid9.full .obj:not(.sel){opacity:.4}
.obj.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tray{flex:none;display:flex;align-items:center;gap:10px;background:var(--navy);padding:10px;margin-top:2px}
.tray .tl{flex:none;font-family:var(--serif);font-weight:400;font-size:14px;line-height:1.1;color:var(--champ);width:58px}
.slots{display:flex;gap:6px}
.slot{width:40px;height:40px;box-shadow:inset 0 0 0 1px rgba(214,181,133,.5);display:flex;align-items:center;justify-content:center;color:var(--champ);overflow:hidden;position:relative}
.slot svg{width:26px;height:26px}
.slot.fill{background:var(--navy-2);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}
.tray .cta{flex:1;width:auto;height:44px;font-size:12px;letter-spacing:.12em;white-space:nowrap;padding:0 8px}
@media (max-width:380px){.slot{width:34px;height:34px}.slot svg{width:22px;height:22px}.tray .tl{display:none}}

/* cena vista (janelas) */
.win{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:8px 8px 10px}
.win .frame{position:relative;flex:1;min-height:0;background:var(--light);color:var(--ink);overflow:hidden}
.win .frame svg{width:100%;height:100%;display:block}
.win .txt{flex:none;font-family:var(--serif);font-weight:400;font-size:17px;line-height:1.22;color:var(--ink);padding:0 34px 0 4px}
.win .tick{top:auto;bottom:8px}

/* cena propósito */
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 10px;box-shadow:inset 0 0 0 1px var(--gold-dk);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dk)}
.card{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.2;color:var(--ink)}
.card .arr{flex:none;width:22px;color:var(--gold-dk)}
.card.sel{background:var(--navy);color:#fff;box-shadow:none}
.card.sel .arr{color:var(--champ)}

/* faixa */
.range{flex:none;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 18px;box-shadow:inset 0 0 0 1px rgba(214,181,133,.55);font-family:var(--serif);font-weight:400;font-size:19px;color:#fff}
.range .dot{width:14px;height:14px;box-shadow:inset 0 0 0 1px var(--champ)}
.range.sel{background:var(--gold);color:#0D1F42;box-shadow:none}
.range.sel .dot{background:#0D1F42;box-shadow:none}

/* cadastro */
.form-wrap{flex:1;min-height:0;overflow-y:auto;padding-block:8px max(22px,env(safe-area-inset-bottom,0px))}
.locked-card{position:relative;background:var(--navy-2);padding:18px;margin-top:18px;overflow:hidden}
.locked-card .blur{filter:blur(7px);opacity:.85;user-select:none}
.locked-card .blur b{display:block;font-family:var(--serif);font-size:34px;color:#fff;line-height:1.1}
.locked-card .blur .bars{margin-top:12px;display:grid;gap:7px}
.locked-card .blur .bars i{display:block;height:6px;background:var(--champ)}
.locked-card .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--champ);text-align:center}
.locked-card .lock svg{width:26px;height:26px}
/* formulário nativo RD no visual do jogo */
.rdwrap{margin-top:6px}
.rdwrap .rdload{font-size:12px;color:var(--on-navy);opacity:.6;margin:18px 0}
.rdwrap.on .rdload{display:none}
.rdwrap form,.rdwrap section,.rdwrap .bricks--section,.rdwrap .bricks--column,.rdwrap .bricks--row,.rdwrap .bricks--component,.rdwrap div{background:transparent!important;box-shadow:none!important;max-width:100%!important}
.rdwrap form{padding:0!important;margin:0!important;width:100%!important}
.rdwrap h1,.rdwrap h2,.rdwrap h3{display:none!important}
.rdwrap label,.rdwrap .bricks-form__label{display:block!important;font-family:var(--sans)!important;font-size:10.5px!important;letter-spacing:.27em!important;text-transform:uppercase!important;color:var(--champ)!important;margin:16px 0 6px!important;font-weight:400!important;text-align:left!important}
.rdwrap input[type=text],.rdwrap input[type=email],.rdwrap input[type=tel],.rdwrap input:not([type]),.rdwrap select,.rdwrap textarea{width:100%!important;box-sizing:border-box!important;height:50px!important;padding:0 14px!important;background:rgba(255,255,255,.06)!important;border:1px solid rgba(214,181,133,.5)!important;border-radius:0!important;color:#fff!important;font-family:var(--sans)!important;font-size:16px!important;outline:none!important;box-shadow:none!important}
.rdwrap input:focus{border-color:var(--champ)!important;background:rgba(255,255,255,.1)!important}
.rdwrap input::placeholder{color:rgba(233,228,218,.45)!important}
.rdwrap input[type=checkbox]{width:auto!important;height:auto!important;accent-color:var(--gold)}
.rdwrap p,.rdwrap span,.rdwrap .bricks-form__field__option__label,.rdwrap a{font-family:var(--sans)!important;font-size:12px!important;line-height:1.5!important;color:var(--on-navy)!important}
.rdwrap button,.rdwrap input[type=submit],.rdwrap .bricks--component-button{display:flex!important;align-items:center;justify-content:center;width:100%!important;height:52px!important;margin-top:18px!important;background:var(--gold)!important;color:#0D1F42!important;border:0!important;border-radius:0!important;font-family:var(--sans)!important;font-weight:700!important;font-size:14px!important;letter-spacing:.14em!important;text-transform:uppercase!important;cursor:pointer}
.rdwrap .error,.rdwrap [class*="error"]{color:#F1B9AA!important}
.field{display:block;margin-top:16px}
.field span{display:block;font-size:10.5px;letter-spacing:.27em;text-transform:uppercase;color:var(--champ);margin-bottom:6px}
.field input{width:100%;box-sizing:border-box;height:50px;padding:0 14px;background:rgba(255,255,255,.06);border:1px solid rgba(214,181,133,.5);border-radius:0;color:#fff;font-family:var(--sans);font-size:16px;outline:none}
.field input:focus{border-color:var(--champ);background:rgba(255,255,255,.1)}
.field input::placeholder{color:rgba(233,228,218,.45)}
.field.err input{border-color:#E0A08F}
.field em{display:block;font-style:normal;font-size:12px;color:#F1B9AA;margin-top:5px}
.consent{font-size:12px;line-height:1.5;color:var(--on-navy);opacity:.78;margin:16px 0 14px}
.proto{margin-top:12px;font-size:11px;line-height:1.5;color:var(--champ);opacity:.8;text-align:center}

/* revelação: portas */
.doors-open{position:absolute;inset:0;z-index:20;display:flex;pointer-events:none}
.doors-open .leaf{flex:1;background:var(--navy);position:relative;transition:transform 1.05s cubic-bezier(.7,0,.2,1)}
.doors-open .leaf::after{content:"";position:absolute;inset:18px 14px;box-shadow:inset 0 0 0 1px rgba(214,181,133,.55)}
.doors-open .leaf.l::before,.doors-open .leaf.r::before{content:"";position:absolute;top:50%;width:6px;height:6px;background:var(--champ);z-index:1}
.doors-open .leaf.l::before{right:26px}
.doors-open .leaf.r::before{left:26px}
.doors-open.go .leaf.l{transform:translateX(-101%)}
.doors-open.go .leaf.r{transform:translateX(101%)}
.doors-open .seal-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font-family:var(--serif);font-weight:400;font-size:16px;color:var(--champ);background:var(--navy);padding:10px 14px;box-shadow:inset 0 0 0 1px var(--champ);transition:opacity .3s;white-space:nowrap}
.doors-open.go .seal-c{opacity:0}

/* resultado */
.result{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.res-hero{padding-block:24px 22px}
.res-hero .h-xl{font-size:52px;margin-top:8px}
.res-hero .prop{margin-top:10px}
.res-hero .tese{margin:12px 0 0;font-size:15px;line-height:1.55;max-width:34ch}
.res-photo{position:relative;margin-top:20px;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--navy-2);color:var(--champ)}
.res-photo > svg{position:absolute;inset:0;width:100%;height:100%}
.mini{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;margin-top:12px;box-shadow:inset 0 0 0 1px rgba(214,181,133,.55);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--champ);text-decoration:none}
.mini svg{width:12px;height:12px}
.res-sec{padding-block:26px 0}
.res-sec h2{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.2;color:var(--ink);margin:6px 0 0}
.reasons{list-style:none;margin:12px 0 0;padding:0}
.reasons li{padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5;color:var(--text)}
.reasons li:last-child{border-bottom:1px solid var(--line)}
.aff{margin-top:14px;display:grid;gap:16px}
.aff .it{display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:7px}
.aff .nm{font-family:var(--serif);font-weight:400;font-size:16px;color:var(--ink)}
.aff .nm small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--mist);margin-left:6px}
.aff .pc{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--mist);font-variant-numeric:tabular-nums}
.aff .track{grid-column:1/-1;display:block;height:10px;background:#ECE8E0;overflow:hidden}
.aff .fill{display:block;height:100%;width:0;background:#9AA1AF;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.aff .it.top1 .fill{background:var(--gold)}
.aff .it.top1 .pc{font-size:24px;color:var(--ink)}
.ficha{margin-top:22px;padding:18px}
.ficha .price{font-family:var(--serif);font-weight:400;font-size:28px;color:#fff;margin-top:4px;line-height:1.15}
.ficha p{margin:8px 0 0;font-size:13.5px}
.actions{display:grid;gap:10px;padding-block:22px 0}
.wa-note{font-size:12px;line-height:1.5;color:var(--mist);text-align:center;margin:2px 0 0}
.wa-note b{color:var(--ink);user-select:all}
.others{display:grid;gap:10px;margin-top:4px}
.others[hidden]{display:none}
.other{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.other b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-top:4px}
.other p{margin:6px 0 0;font-size:13.5px;color:var(--text)}
.other a{display:inline-block;margin-top:10px;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--gold)}
.again{display:block;margin:20px auto 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);text-align:center;text-decoration:underline;text-underline-offset:4px}
.legal{padding-block:22px max(26px,env(safe-area-inset-bottom,0px));font-size:11px;line-height:1.5;color:var(--mist);text-align:center}

/* card para stories */
.story{position:absolute;inset:0;z-index:30;background:rgba(8,18,40,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.story[hidden]{display:none}
.story .sc{position:relative;width:min(78vw,300px);aspect-ratio:9/16;max-width:100%;max-height:74%;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(214,181,133,.5)}
.story .sc .pic{position:relative;flex:1.25;min-height:0;overflow:hidden;background:var(--navy-2);color:var(--champ)}
.story .sc .pic > svg{position:absolute;inset:0;width:100%;height:100%}
.story .sc .pic .logo{position:absolute;top:16px;left:16px;z-index:2;height:14px;width:auto}
.res-hero .logo{display:block;height:20px;width:auto}
.story .sc .pic::after{content:"";position:absolute;inset:0 0 auto;height:40%;background:linear-gradient(rgba(12,31,66,.75),rgba(12,31,66,0));z-index:1}
.story .sc .txt{flex:1;padding:16px 18px 18px;display:flex;flex-direction:column;justify-content:space-between}
.story .sc b{display:block;font-family:var(--serif);font-size:36px;line-height:1.05;color:#fff;margin-top:6px}
.story .sc .pct{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--champ)}
.story .tip{font-size:13px;color:var(--on-navy);text-align:center;max-width:30ch}
.story .close{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff}
.story .close svg{width:20px;height:20px}

@media (max-height:640px){
  .h-q{font-size:24px}
  .intro .h-xl{font-size:34px}
  .door .pic{max-height:26vh}
  .qblock{padding-block:8px 12px}
  .shot .cap{font-size:16px}
  .row .txt{font-size:17px}
  .card{font-size:19px;padding:12px 16px}
  .half{font-size:24px}
}

/* capa centralizada + logo */
.cap-logo{display:block;margin:0 auto 22px;height:34px;width:auto}
.intro.dark .cap-logo{height:20px}
.intro.center .intro-body{text-align:center}
.intro.center .h-xl{font-size:34px;max-width:18ch;margin-left:auto;margin-right:auto}
.intro.center .sub{max-width:40ch;margin-left:auto;margin-right:auto;text-wrap:balance}
@media (max-width:360px){.intro.center .sub{font-size:14px}}
/* cartas: distribuição, flutuação e brilho */
.intro.cards .door .pic{animation:none}
.intro.cards .door:nth-of-type(1){animation:deal1 .9s cubic-bezier(.2,.8,.2,1) .3s both,float1 5.2s ease-in-out 1.2s infinite}
.intro.cards .door:nth-of-type(2){animation:deal2 .9s cubic-bezier(.2,.8,.2,1) .15s both,float2 4.6s ease-in-out 1.05s infinite}
.intro.cards .door:nth-of-type(3){animation:deal3 .9s cubic-bezier(.2,.8,.2,1) .45s both,float3 5.6s ease-in-out 1.35s infinite}
@keyframes deal1{from{opacity:0;transform:translateX(95%) translateY(28px) rotate(0)}to{opacity:1;transform:rotate(-8deg) translateY(14px)}}
@keyframes deal2{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:translateY(-4px)}}
@keyframes deal3{from{opacity:0;transform:translateX(-95%) translateY(28px) rotate(0)}to{opacity:1;transform:rotate(8deg) translateY(14px)}}
@keyframes float1{0%,100%{transform:rotate(-8deg) translateY(14px)}50%{transform:rotate(-10deg) translateY(6px)}}
@keyframes float2{0%,100%{transform:translateY(-4px)}50%{transform:translateY(-13px)}}
@keyframes float3{0%,100%{transform:rotate(8deg) translateY(14px)}50%{transform:rotate(10deg) translateY(6px)}}
.intro.cards .door .pic::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:150% 0;animation:sheen 6s ease-in-out infinite}
.intro.cards .door:nth-of-type(2) .pic::after{animation-delay:2s}
.intro.cards .door:nth-of-type(3) .pic::after{animation-delay:4s}
@keyframes sheen{0%,62%{background-position:150% 0}88%,100%{background-position:-60% 0}}
@media (max-height:760px){
  .cap-logo{margin-bottom:14px;height:28px}.intro.dark .cap-logo{height:17px}
  .intro.center .h-xl{font-size:30px}
  .intro.oracle .doors,.intro.oracle.cards .doors{margin-top:112px}
  .intro.oracle .ball{top:-116px;width:min(250px,74%)}
  .intro.cards .door .pic{max-height:25vh}
}
@media (max-height:680px){
  .intro.center .h-xl{font-size:27px}
  .intro.oracle .doors,.intro.oracle.cards .doors{margin-top:92px;margin-bottom:22px}
  .intro.oracle .ball{top:-96px;width:min(210px,64%)}
  .intro.cards .door .pic{max-height:22vh}
  .doors-cap{margin-top:6px}
}
/* leitura da bola de cristal durante o jogo */
.meter{display:flex;align-items:center;gap:7px}
.meter .mb{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#fff 0,var(--orb-2) 55%,var(--orb-3) 100%);box-shadow:0 0 0 1px var(--orb-line),0 0 8px rgba(214,181,133,.6);animation:mbglow 2.6s ease-in-out infinite}
@keyframes mbglow{0%,100%{box-shadow:0 0 0 1px var(--orb-line),0 0 6px rgba(214,181,133,.5)}50%{box-shadow:0 0 0 1px var(--orb-line),0 0 15px rgba(214,181,133,1)}}
.meter i{font-style:normal;font-family:var(--serif);font-weight:400;font-size:13px;color:var(--ink);opacity:var(--o,.3);transition:opacity .6s}
.dark .meter i{color:#fff}
.meter i.lead{color:var(--gold-dk);opacity:1;text-shadow:0 0 10px rgba(214,181,133,.9);animation:leadpop .7s ease-out}
.dark .meter i.lead{color:var(--champ)}
@keyframes leadpop{0%{transform:scale(1.5)}100%{transform:none}}
/* revelação: a carta vira */
.flipper{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--light);perspective:1200px;transition:opacity .5s}
.dark .flipper{background:var(--navy)}
.flipper.done{opacity:0;pointer-events:none}
.flipper .float{animation:float2b 2.6s ease-in-out infinite}
@keyframes float2b{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.card3d{position:relative;width:min(60vw,240px);aspect-ratio:9/14;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.flipper.go .card3d{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:5px solid var(--paper);box-shadow:0 22px 40px rgba(12,31,66,.35)}
.face.f-back{background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;--orb-1:rgba(214,181,133,.42);--orb-2:rgba(30,51,97,.75);--orb-3:rgba(22,40,79,.95);--orb-line:#D6B585;--core:#FFE9BF}
.face.f-back::before{content:"";position:absolute;inset:9px;box-shadow:inset 0 0 0 1px rgba(214,181,133,.6)}
.face.f-back .ball{display:block;position:relative;width:74%;aspect-ratio:1}
.face.f-back .ball svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 14px rgba(214,181,133,.55))}
.face.f-back .label{color:var(--champ)}
.face.f-front{transform:rotateY(180deg);background:var(--navy-2);color:var(--champ)}
.face.f-front > svg{position:absolute;inset:0;width:100%;height:100%}
.face.f-front .num{position:absolute;top:10px;left:10px;z-index:3;min-width:28px;height:28px;padding:0 6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--champ);font-family:var(--serif);font-weight:400;font-size:14px}
.face.f-front .nm{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:34px 14px 14px;background:linear-gradient(to top,rgba(12,31,66,.94),rgba(12,31,66,0));font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1;color:#fff}
.face.f-front .nm small{display:block;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.27em;text-transform:uppercase;color:var(--champ);margin-bottom:6px}
.flipper .fcap{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--ink);text-align:center;min-height:1.3em}
.dark .flipper .fcap{color:#fff}
/* tema escuro nas cenas e no resultado */
.dark .shot{box-shadow:inset 0 0 0 1px rgba(214,181,133,.35)}
.dark .half{box-shadow:inset 0 0 0 1px rgba(214,181,133,.3)}
.dark .tray{background:var(--navy-2)}
.dark .badge{color:var(--champ);box-shadow:inset 0 0 0 1px var(--champ)}
.dark .row,.dark .swatch,.dark .win,.dark .card,.dark .obj{box-shadow:none}
.dark .res-hero{border-bottom:1px solid rgba(214,181,133,.25)}
.dark .res-sec h2{color:#fff}
.dark .reasons li{color:var(--on-navy);border-color:rgba(214,181,133,.22)}
.dark .aff .nm{color:#fff}
.dark .aff .nm small{color:rgba(233,228,218,.7)}
.dark .aff .pc{color:rgba(233,228,218,.75)}
.dark .aff .it.top1 .pc{color:#fff}
.dark .aff .track{background:rgba(255,255,255,.12)}
.dark .ficha{background-color:var(--navy-2)}
.dark .cta-ghost{color:#fff}
.dark .wa-note{color:var(--on-navy)}
.dark .wa-note b{color:#fff}
.dark .again{color:var(--on-navy)}
.dark .legal{color:rgba(233,228,218,.6)}

/* cena 1: cartas verticais em leque */
.deck{flex-direction:row;align-items:center;justify-content:center;gap:0;padding-top:0}
.tslot{position:relative;flex:0 0 31.5%;margin:0 .6%;display:flex;animation:dealc .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.deck{position:relative}
.deck .ball{display:block;position:absolute;left:0;right:0;margin:0 auto;top:max(0px,calc(50% - 262px));width:min(290px,80%);aspect-ratio:1;z-index:0;pointer-events:none;animation:rise .8s ease both}
.deck .ball svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 16px rgba(214,181,133,.45))}
.tslot{z-index:1}
.tslot:nth-of-type(2){z-index:2}
.tslot.up{z-index:5}
@keyframes dealc{from{opacity:0;transform:translateY(80px) scale(.92)}to{opacity:1;transform:none}}
.tcard{position:relative;width:100%;aspect-ratio:3/5;flex:none;display:block;overflow:hidden;background:var(--navy-2);color:var(--champ);border:5px solid var(--paper);box-shadow:0 16px 28px rgba(12,31,66,.28);transform:rotate(var(--r)) translateY(var(--y));transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .4s,opacity .35s}
.dark .tcard{box-shadow:0 16px 28px rgba(0,0,0,.45)}
.tcard > svg{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.tcard .ph{z-index:1}
.tcard .orn{position:absolute;top:7px;left:7px;z-index:3;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--champ)}
.tcard .orn svg{width:11px;height:11px}
.tcard .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 10px 10px;background:linear-gradient(to top,rgba(12,31,66,.94),rgba(12,31,66,0));font-family:var(--serif);font-weight:400;font-size:14.5px;line-height:1.22;color:#fff;text-align:left}
.tcard .tick{z-index:4;top:7px;right:7px;width:24px;height:24px}
.tcard.sel{transform:rotate(0) translateY(-18px) scale(1.07);box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(214,181,133,.85),0 20px 34px rgba(12,31,66,.35)}
.deck.locked .tcard:not(.sel){opacity:.25;transform:rotate(var(--r)) translateY(calc(var(--y) + 18px)) scale(.94)}
.meter.read .mb{animation:mbflash .9s ease-out}
@keyframes mbflash{0%{transform:scale(1)}30%{transform:scale(1.45);box-shadow:0 0 0 1px var(--orb-line),0 0 24px rgba(214,181,133,1)}100%{transform:scale(1)}}
.wip{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding-block:40px}
.wip .h-xl{font-size:38px}
.wip .sub{max-width:30ch;margin:0 auto 10px}

/* cena 2: baralho empilhado para deslizar */
.stackwrap{gap:14px}
.stack{position:relative;flex:1;min-height:0;touch-action:pan-y;animation:dealc .7s cubic-bezier(.2,.8,.2,1) both}
.scard{position:absolute;inset:0;margin:auto;height:min(100%,380px);aspect-ratio:3/4;width:auto;max-width:82%;overflow:hidden;background:var(--navy-2);color:var(--champ);border:6px solid var(--paper);box-shadow:0 18px 32px rgba(12,31,66,.26);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,box-shadow .3s;cursor:grab;user-select:none;-webkit-user-select:none}
.scard > svg{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.scard .ph{z-index:1;pointer-events:none}
.scard .orn{position:absolute;top:9px;left:9px;z-index:3;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--champ)}
.scard .orn svg{width:12px;height:12px}
.scard .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:44px 16px 16px;background:linear-gradient(to top,rgba(12,31,66,.94),rgba(12,31,66,0));font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.15;color:#fff;text-align:left}
.scard .tick{position:absolute;top:9px;right:9px;z-index:4;width:28px;height:28px;background:var(--gold);color:#0D1F42;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.scard .tick svg{width:14px;height:14px}
.scard.r0{z-index:3}
.scard.r1{z-index:2;transform:translate(16px,10px) rotate(5deg) scale(.95)}
.scard.r2{z-index:1;transform:translate(-16px,16px) rotate(-5deg) scale(.91)}
.scard.r1,.scard.r2{pointer-events:none}
.scard.r1 .cap,.scard.r2 .cap{opacity:0}
.scard.drag{transition:none;cursor:grabbing}
.scard.fly-l{transform:translateX(-130%) rotate(-14deg)!important;opacity:0}
.scard.fly-r{transform:translateX(130%) rotate(14deg)!important;opacity:0}
.scard.sel{transform:scale(1.04)!important;box-shadow:0 0 0 2px var(--gold),0 0 34px rgba(214,181,133,.85),0 22px 36px rgba(12,31,66,.3)}
.scard.sel .tick{transform:scale(1)}
.stack.locked .scard:not(.sel){opacity:0}
.sctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:18px}
.snav{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.snav svg{width:16px;height:16px}
.snav.nx svg{transform:scaleX(-1)}
.dark .snav{color:#fff;box-shadow:inset 0 0 0 1px rgba(214,181,133,.4)}
.sdots{display:flex;gap:8px}

    t(w.perfil+".","400 128px Gelasio, Georgia, serif","#FFFFFF",1420,0);
    t(w.nome.toUpperCase(),"400 30px Arimo, Arial, sans-serif","#FFFFFF",1490,5);
    x.fillStyle="#C9A84C"; x.fillRect(90,1560,70,2);
    t(pct+"% de afinidade","400 60px Gelasio, Georgia, serif","#D6B585",1680,0);
    t("DESCUBRA O SEU  ·  @WEVEREALTY","400 28px Arimo, Arial, sans-serif","#D6B585",1790,5);
    return new Promise(function(ok,no){c.toBlob(function(b){b?ok(new File([b],"meu-proximo-endereco.png",{type:"image/png"})):no();},"image/png");});
  });
}
function resKey(k){return "res-"+(k==="e702"?"702":k);}
function renderReveal(dir){
  var r=score(), w=Object.assign({},P[r.win],{key:r.win}), first=(st.lead&&st.lead.nome||"").split(" ")[0];
  var rs=reasons(r.win).map(function(t){return '<li>'+esc(t)+'</li>';}).join("");
  var aff=r.rank.map(function(k){return '<div class="it'+(k===r.win?" top1":"")+'"><span class="nm">'+esc(P[k].perfil)+'<small>'+esc(P[k].nome)+'</small></span><span class="pc" data-to="'+r.pct[k]+'">0%</span><span class="track"><span class="fill" data-w="'+r.pct[k]+'"></span></span></div>';}).join("");
  var others=r.rank.slice(1).map(function(k){var o=P[k];return '<div class="other"><span class="label">'+esc(o.perfil)+' · '+r.pct[k]+'%</span><b>'+esc(o.nome)+'</b><p>'+esc(o.local)+' · '+esc(o.from.toLowerCase())+' '+esc(o.preco)+'</p><a href="'+o.url+'" target="_blank" rel="noopener">Conhecer o imóvel ↗</a></div>';}).join("");
  var msg="Olá, Weve. "+(first?("Sou "+first+". "):"")+"Fiz o jogo Seu próximo endereço e meu perfil é "+w.perfil+" ("+w.nome+"). Quero conversar com um consultor.";
  var wa="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
  var photo=svg("0 0 200 110",A[w.art],'preserveAspectRatio="xMidYMid slice"')+ph(resKey(r.win));
  var el=mount(
    '<div class="result">'+
      '<div class="res-hero dark"><div class="pad">'+
        '<img class="logo" src="'+LOGO+'" alt="Weve Realty">'+
        '<div class="label" style="margin-top:24px">'+(first?esc(first)+", seu perfil é":"Seu perfil é")+'</div>'+
        '<h1 class="h-xl">'+esc(w.perfil)+'.</h1>'+
        '<div class="label prop">'+esc(w.nome)+' · '+esc(w.local)+'</div>'+
        '<p class="tese">'+esc(w.tese)+'</p>'+
        '<div class="res-photo">'+photo+'</div>'+
        '<a class="mini" href="'+w.url+'" target="_blank" rel="noopener">Ver o imóvel '+OUT+'</a>'+
      '</div></div>'+
      '<div class="res-sec pad"><span class="label">Suas escolhas</span><h2>Por que este endereço</h2><ul class="reasons">'+rs+'</ul></div>'+
      '<div class="res-sec pad"><span class="label">Afinidade</span><h2>Você e os três endereços</h2><div class="aff">'+aff+'</div>'+
        '<div class="ficha dark"><span class="label">'+esc(w.from)+'</span><div class="price">'+esc(w.preco)+'</div><p>'+esc(w.ficha)+'</p></div></div>'+
      '<div class="actions pad">'+
        '<a class="cta" href="'+wa+'" target="_blank" rel="noopener">Falar com um consultor</a>'+
        '<button class="cta-ghost" id="see">Ver os outros endereços</button>'+
        '<div class="others" id="others" hidden>'+others+'</div>'+
        '<button class="cta-ghost" id="share">Compartilhar nos stories</button>'+
        '<button class="again" id="again">Jogar de novo</button>'+
      '</div>'+
      '<div class="legal pad">Valores conforme weverealty.com em 06/11/2026.</div>'+
    '</div>'+
    '<div class="flipper" id="flip"><div class="float"><div class="card3d"><div class="face f-back"><span class="ball">'+BALL+'</span><span class="label">Sua carta</span></div>'+
      '<div class="face f-front">'+photo+'<span class="num stars">'+stars(1)+'</span><span class="nm"><small>Seu perfil</small>'+esc(w.perfil)+'</span></div></div></div>'+
      '<p class="fcap" id="fcap">A bola de cristal está lendo o seu sábado…</p></div>'+
    '<div class="story" id="story" hidden><button class="close" id="sclose" aria-label="Fechar">'+XX+'</button>'+
      '<div class="sc dark"><div class="pic">'+photo+'<img class="logo" src="'+LOGO+'" alt="Weve Realty"></div>'+
      '<div class="txt"><div><span class="label">Meu próximo endereço</span><b>'+esc(w.perfil)+'.</b><span class="label" style="color:#fff;margin-top:6px;display:block">'+esc(w.nome)+'</span></div>'+
      '<div><div class="pct">'+r.pct[r.win]+'% de afinidade</div><span class="label">Descubra o seu · @weverealty</span></div></div></div>'+
      '<p class="tip">Tire um print desta tela e poste nos seus stories marcando @weverealty.</p></div>',
    tcls(),dir);
  var fl=el.querySelector("#flip"), fc=el.querySelector("#fcap");
  setTimeout(function(){fl.classList.add("go");},1100);
  setTimeout(function(){fc.textContent="Esta é a sua carta.";},1700);
  setTimeout(function(){fl.classList.add("done");},3100);
  setTimeout(function(){if(fl.parentNode)fl.remove();},3700);
  setTimeout(function(){
    el.querySelectorAll(".fill").forEach(function(f){f.style.width=f.dataset.w+"%";});
    el.querySelectorAll(".pc").forEach(function(p){
      var to=+p.dataset.to, t0=null;
      function step(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/1000);p.textContent=Math.round(to*(1-Math.pow(1-k,3)))+"%";if(k<1)requestAnimationFrame(step);}
      requestAnimationFrame(step);

  el.querySelector("#sclose").addEventListener("click",function(){story.hidden=true;});
  el.querySelector("#again").addEventListener("click",function(){st={step:"intro",a:{},range:null,lead:st.lead};go("intro",-1);});

/* ---------- início ---------- */
function start(data){
  if(data&&data.st&&data.st.step){st=data.st; var s=st.step; if(s===4||s===5) delete st.a[s]; go(s,1);}
  else go("intro",1);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){window.claude.hot.snapshot(function(){return {st:st};});}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start);}
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
window.__weve={st:function(){return st;},score:score,reasons:reasons,go:go,story:makeStory};
})();
